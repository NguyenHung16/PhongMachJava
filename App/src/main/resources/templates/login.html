<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{base :: bt}"></th:block>
    <style>
        body { background: linear-gradient(135deg, #f8f9fc 0%, #e2e8f0 100%); min-height: 100vh; display: flex; align-items: center; }
        .login-card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; width: 100%; max-width: 450px; margin: auto; background: white; }
        .login-header { background: #4e73df; padding: 40px; text-align: center; color: white; }
        .login-body { padding: 40px; }
        .form-control { border-radius: 10px; padding: 12px 20px; border: 1px solid #eee; background: #fcfcfc; }
        .form-control:focus { box-shadow: none; border-color: #4e73df; background: white; }
        .btn-login { border-radius: 10px; padding: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s; background: #4e73df; color: white; border: none; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(78,115,223,0.3); background: #224abe; }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="login-header">
                <i class="bi bi-hospital fs-1 d-block mb-2"></i>
                <h3 class="fw-bold mb-0">Đăng Nhập Hệ Thống</h3>
                <p class="small opacity-75 mt-2">Phòng Khám Đa Khoa QH</p>
            </div>
            <div class="login-body">
                <div th:if="${param.error}" class="alert alert-danger border-0 small mb-4" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i> Thông tin đăng nhập không chính xác.
                </div>

                <div th:if="${param.logout}" class="alert alert-success border-0 small mb-4" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i> Đăng xuất thành công.
                </div>

                <form th:action="@{/login}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Tên đăng nhập</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control border-start-0" name="username" placeholder="Username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control border-start-0" name="password" placeholder="Password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-login w-100 mb-3">Đăng nhập</button>

                    <div class="text-center mt-3">
                        <a href="#" class="text-decoration-none small text-muted">Quên mật khẩu?</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
