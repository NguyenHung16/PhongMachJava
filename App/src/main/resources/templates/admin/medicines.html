<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head}"></head>
<body>
    <header th:replace="~{admin/layout :: header}"></header>

    <div class="container-fluid">
        <div class="row">
            <nav th:replace="~{admin/layout :: sidebar}"></nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Quản lý thuốc</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <button type="button" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-plus-circle"></i> Thêm thuốc mới
                        </button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover table-bordered">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Tên thuốc</th>
                                <th>Đơn vị</th>
                                <th>Giá (VNĐ)</th>
                                <th>Mô tả</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="m : ${medicines}">
                                <td th:text="${m.id}"></td>
                                <td th:text="${m.name}"></td>
                                <td th:text="${m.unit}"></td>
                                <td th:text="${#numbers.formatDecimal(m.price, 0, 'COMMA', 0, 'POINT')}"></td>
                                <td th:text="${m.description}"></td>
                                <td>
                                    <button class="btn btn-sm btn-warning"><i class="bi bi-pencil-square"></i></button>
                                    <button class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <div th:replace="~{admin/layout :: scripts}"></div>
</body>
</html>
