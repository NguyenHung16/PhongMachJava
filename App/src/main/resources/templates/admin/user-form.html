<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head}"></head>
<body>
    <div th:replace="~{admin/layout :: sidebar}"></div>

    <div class="wrapper">
        <div th:replace="~{admin/layout :: topbar}"></div>

        <div class="content-area">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Trang chủ</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/users}">Người dùng</a></li>
                    <li class="breadcrumb-item active">Thêm mới</li>
                </ol>
            </nav>

            <div class="card shadow-sm mx-auto" style="max-width: 700px;">
                <div class="card-header py-3 bg-white">
                    <h5 class="mb-0 text-primary fw-bold">
                        <i class="bi bi-person-plus me-2"></i> TẠO TÀI KHOẢN MỚI
                    </h5>
                </div>
                <div class="card-body p-4">
                    <form method="post" th:action="@{/admin/users/save}" enctype="multipart/form-data">
                        <div class="row g-3">
                            <div class="col-md-7">
                                <label class="form-label fw-semibold small">Họ và tên <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" name="fullName" required placeholder="Nhập tên người dùng...">
                            </div>
                            <div class="col-md-5">
                                <label class="form-label fw-semibold small">Vai trò hệ thống <span class="text-danger">*</span></label>
                                <select class="form-select" name="role" required>
                                    <option value="PATIENT">Bệnh nhân (Patient)</option>
                                    <option value="ADMIN">Quản trị viên (Admin)</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Tên đăng nhập <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" name="username" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Mật khẩu <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" name="password" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Địa chỉ Email</label>
                                <input type="email" class="form-control" name="email" placeholder="example@mail.com">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Số điện thoại</label>
                                <input type="text" class="form-control" name="phoneNumber">
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold small">Ảnh đại diện</label>
                                <input type="file" class="form-control" name="avatar" accept="image/*">
                            </div>
                        </div>

                        <div class="mt-4 pt-3 border-top d-flex justify-content-end gap-2">
                            <a th:href="@{/admin/users}" class="btn btn-light border px-4">Hủy</a>
                            <button type="submit" class="btn btn-primary px-5 shadow-sm">
                                <i class="bi bi-person-check me-1"></i> Tạo tài khoản
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
