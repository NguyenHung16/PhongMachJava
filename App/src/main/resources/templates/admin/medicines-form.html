<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head}"></head>
<body>
    <div th:replace="~{admin/layout :: sidebar}"></div>

    <div class="wrapper">
        <div th:replace="~{admin/layout :: topbar}"></div>

        <div class="content-area">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Trang chủ</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/medicines}">Danh mục thuốc</a></li>
                    <li class="breadcrumb-item active" th:text="${medicine.id == null ? 'Thêm mới' : 'Cập nhật'}"></li>
                </ol>
            </nav>

            <div class="card shadow-sm mx-auto" style="max-width: 800px;">
                <div class="card-header py-3 bg-white">
                    <h5 class="mb-0 text-primary fw-bold">
                        <i class="bi bi-capsule me-2"></i>
                        <span th:text="${medicine.id == null ? 'THÊM THUỐC MỚI' : 'CẬP NHẬT THÔNG TIN THUỐC'}"></span>
                    </h5>
                </div>
                <div class="card-body p-4">
                    <form method="post" th:object="${medicine}" th:action="@{/admin/medicines/save}" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{id}" />
                        <input type="hidden" th:field="*{imageUrl}" />

                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label fw-semibold small">Tên thuốc <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{name}" placeholder="Nhập tên thuốc..." required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold small">Giá bán (VNĐ) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="number" class="form-control" th:field="*{price}" placeholder="0" required>
                                    <span class="input-group-text">đ</span>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Dạng bào chế</label>
                                <input type="text" class="form-control" th:field="*{dosageForm}" placeholder="Ví dụ: Viên nén, Siro...">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Đơn vị tính</label>
                                <input type="text" class="form-control" th:field="*{unit}" placeholder="Ví dụ: Viên, Vỉ, Hộp...">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Số lượng tồn kho <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" th:field="*{stockQuantity}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Hạn sử dụng</label>
                                <input type="date" class="form-control" th:field="*{expiryDate}">
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold small">Nhà sản xuất</label>
                                <input type="text" class="form-control" th:field="*{manufacturer}" placeholder="Nhập tên hãng sản xuất...">
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold small">Hình ảnh thuốc</label>
                                <div class="border rounded p-3 bg-light text-center">
                                    <input type="file" class="form-control mb-2" name="imageFile" id="imageInput" accept="image/*">
                                    <div th:if="${medicine.imageUrl != null}" id="imagePreviewContainer" class="mt-2">
                                        <p class="text-muted small mb-1">Ảnh hiện tại:</p>
                                        <img th:src="${medicine.imageUrl}" class="img-thumbnail" style="max-height: 150px;">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mt-4 d-flex justify-content-end gap-2">
                            <a th:href="@{/admin/medicines}" class="btn btn-light border px-4">Hủy bỏ</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-save me-1"></i> Lưu thông tin
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
