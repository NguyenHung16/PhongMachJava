<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản trị - Phòng Khám QH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --sidebar-width: 250px; --topbar-height: 60px; --primary-color: #2c3e50; --accent-color: #3498db; }
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; margin: 0; overflow-x: hidden; }
        .sidebar { width: var(--sidebar-width); height: 100vh; position: fixed; left: 0; top: 0; background: #1a252f; z-index: 1000; color: #ecf0f1; }
        .sidebar-brand { height: var(--topbar-height); display: flex; align-items: center; padding: 0 1.5rem; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .nav-link { color: #bdc3c7 !important; padding: 0.8rem 1.5rem !important; display: flex; align-items: center; border-left: 4px solid transparent; }
        .nav-link i { font-size: 1.2rem; margin-right: 1rem; width: 20px; }
        .nav-link:hover, .nav-link.active { color: white !important; background: rgba(255,255,255,0.05); border-left-color: var(--accent-color); }
        .sidebar-heading { padding: 1.5rem 1.5rem 0.5rem; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: #7f8c8d; }
        .wrapper { margin-left: var(--sidebar-width); min-height: 100vh; }
        .topbar { height: var(--topbar-height); background: white; border-bottom: 1px solid #e3e6f0; display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; position: sticky; top: 0; z-index: 999; }
        .btn-logout { color: #e74c3c; font-weight: 600; font-size: 0.9rem; text-decoration: none; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        @media (max-width: 992px) { .sidebar { display: none; } .wrapper { margin-left: 0; } }
    </style>
</head>
<body>

<div th:fragment="sidebar" class="sidebar shadow" id="sidebar">
    <div class="sidebar-brand">
        <i class="bi bi-shield-lock-fill me-2 text-info"></i> ADMIN PANEL
    </div>
    <div class="sidebar-heading">Menu chính</div>
    <ul class="nav flex-column">
        <li><a class="nav-link" th:href="@{/admin/dashboard}"><i class="bi bi-grid-1x2-fill"></i> Tổng quan</a></li>
        <li><a class="nav-link" th:href="@{/admin/appointments}"><i class="bi bi-calendar-event"></i> Lịch hẹn</a></li>
        <li><a class="nav-link" th:href="@{/admin/medicines}"><i class="bi bi-capsule"></i> Thuốc</a></li>
    </ul>
    <div class="sidebar-heading">Hệ thống</div>
    <ul class="nav flex-column">
        <li><a class="nav-link" th:href="@{/admin/users}"><i class="bi bi-people"></i> Người dùng</a></li>
        <li><a class="nav-link" th:href="@{/admin/doctors}"><i class="bi bi-person-badge"></i> Bác sĩ</a></li>
        <li><a class="nav-link" th:href="@{/admin/specialties}"><i class="bi bi-diagram-3"></i> Chuyên khoa</a></li>
        <li><a class="nav-link" th:href="@{/stats}"><i class="bi bi-bar-chart-line"></i> Thống kê</a></li>
    </ul>
</div>

<div th:fragment="topbar" class="topbar shadow-sm">
    <div class="d-flex align-items-center">
        <span class="text-muted d-none d-md-inline small fw-medium">Clinic Management System</span>
    </div>

    <div class="d-flex align-items-center gap-4">
        <!-- Cách hiển thị tên an toàn nhất -->
        <div class="d-flex align-items-center gap-2 fw-bold text-dark" sec:authorize="isAuthenticated()">
            <i class="bi bi-person-circle fs-5 text-primary"></i>
            <span th:text="${#authentication.name}">Username</span>
        </div>

        <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="m-0">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn-logout border-0 bg-transparent">
                <i class="bi bi-box-arrow-right"></i> Đăng xuất
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
