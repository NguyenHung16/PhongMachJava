<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <th:block th:fragment="bt">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
        <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
            body { font-family: 'Quicksand', sans-serif; background-color: #f4f7f6; color: #333; }
            .navbar { background: white !important; box-shadow: 0 2px 15px rgba(0,0,0,0.05); }
            .navbar-brand { font-weight: 700; color: #3498db !important; }
            .nav-link { font-weight: 600; color: #555 !important; }
            .btn-primary { background-color: #3498db; border: none; font-weight: 600; }
            .footer { background: #1a252f; color: white; padding: 30px 0; margin-top: 50px; }
        </style>
    </th:block>
</head>
<body>
    <nav th:fragment="menu" class="navbar navbar-expand-lg navbar-light sticky-top py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
                <i class="bi bi-hospital fs-3 me-2"></i> PHÒNG KHÁM QH
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Trang chủ</a></li>

                    <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link dropdown-toggle text-primary" href="#" id="mgrDrop" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-gear-fill me-1"></i> Quản lý
                        </a>
                        <ul class="dropdown-menu shadow border-0">
                            <li><a class="dropdown-item py-2" th:href="@{/admin/dashboard}"><i class="bi bi-grid-fill me-2"></i>Dashboard</a></li>
                            <li><a class="dropdown-item py-2" th:href="@{/admin/medicines}"><i class="bi bi-capsule me-2"></i>Quản lý thuốc</a></li>
                            <li><a class="dropdown-item py-2" th:href="@{/admin/appointments}"><i class="bi bi-calendar-check me-2"></i>Lịch hẹn</a></li>
                            <li><a class="dropdown-item py-2" th:href="@{/admin/users}"><i class="bi bi-people me-2"></i>Người dùng</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item py-2" th:href="@{/stats}"><i class="bi bi-bar-chart-line-fill me-2"></i>Thống kê</a></li>
                        </ul>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto align-items-center">
                    <!-- ĐÃ ĐĂNG NHẬP -->
                    <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle fw-bold text-dark" href="#" id="uDrop" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle fs-5 me-1"></i>
                            <span th:text="${#authentication.name}">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                            <li>
                                <form th:action="@{/logout}" method="post" class="px-3 py-1">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="btn btn-sm btn-outline-danger w-100">Đăng xuất</button>
                                </form>
                            </li>
                        </ul>
                    </li>

                    <!-- CHƯA ĐĂNG NHẬP -->
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="btn btn-primary shadow-sm" th:href="@{/login}">Đăng nhập</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <footer th:fragment="footer" class="footer"><div class="container text-center"><p>&copy; 2025 QH Clinic</p></div></footer>
</body>
</html>
